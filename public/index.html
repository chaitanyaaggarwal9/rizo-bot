<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #0f1115;
    color: #e6e6e6;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid #22252b;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #resetBtn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #2a2e37;
    background: transparent;
    color: #9aa0a6;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  #resetBtn:hover {
    background: #1c1f26;
    color: #e6e6e6;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2b6fef;
    color: white;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #1c1f26;
    border: 1px solid #2a2e37;
  }
  .msg .model-tag {
    display: block;
    font-size: 11px;
    opacity: 0.6;
    margin-bottom: 4px;
  }
  #inputBar {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #22252b;
  }
  #inputBox {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a2e37;
    background: #1c1f26;
    color: #e6e6e6;
    font-size: 14px;
    font-family: inherit;
    resize: none;
  }
  #sendBtn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #2b6fef;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>
  <header>
    Rizo
    <button id="resetBtn">Reset</button>
  </header>
  <div id="messages"></div>
  <div id="inputBar">
    <textarea id="inputBox" rows="1" placeholder="Message..."></textarea>
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('inputBox');
    const sendBtn = document.getElementById('sendBtn');
    const resetBtn = document.getElementById('resetBtn');

    function addMessage(role, text, model) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'assistant' && model) {
        const tag = document.createElement('span');
        tag.className = 'model-tag';
        tag.textContent = model;
        div.appendChild(tag);
      }
      const textNode = document.createElement('span');
      textNode.textContent = text;
      div.appendChild(textNode);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      addMessage('user', message);
      inputEl.value = '';
      sendBtn.disabled = true;

      const thinkingEl = addMessage('assistant', 'Thinking...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();

        thinkingEl.remove();
        if (!res.ok) {
          addMessage('assistant', `Error: ${data.error || 'Request failed'}`);
        } else {
          addMessage('assistant', data.reply, data.model);
        }
      } catch (err) {
        thinkingEl.remove();
        addMessage('assistant', `Error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    async function resetConversation() {
      resetBtn.disabled = true;
      try {
        await fetch('/api/reset', { method: 'POST' });
        messagesEl.innerHTML = '';
      } catch (err) {
        addMessage('assistant', `Error: ${err.message}`);
      } finally {
        resetBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    resetBtn.addEventListener('click', resetConversation);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
