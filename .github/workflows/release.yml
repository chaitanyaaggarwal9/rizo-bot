name: Release

# Tag-triggered on purpose, not "publish on every push to main" — a
# Marketplace publish is hard to fully undo (you can ship a new version
# over it, you can't erase that one was live), so it only fires when you
# explicitly cut a release: git tag v0.2.0 && git push origin v0.2.0.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # softprops/action-gh-release needs write access to create the release
    # and upload the .vsix — without this, the default GITHUB_TOKEN is
    # read-only and that step 403s even though everything before it
    # (including the actual Marketplace publish) succeeds fine.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci

      - run: npm run compile

      # Refuses to publish if the tag and package.json disagree — catches
      # "forgot to bump the version" or "tagged the wrong commit" before
      # anything irreversible happens, rather than after.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag is v$TAG_VERSION but package.json says $PKG_VERSION — refusing to publish a mismatch."
            exit 1
          fi

      - name: Package .vsix
        run: npx vsce package --allow-missing-repository

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --allow-missing-repository -p "${{ secrets.VSCE_PAT }}"

      - name: Attach the .vsix to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/*.vsix
          generate_release_notes: true
