name: CI

# Runs on every pull request and every push to main, with no path filters,
# so its checks can be required by the branch ruleset. Require the
# "CI passed" job: it only succeeds when every job below succeeded.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  malware-scan:
    name: Malware scan
    uses: ./.github/workflows/malware-scan.yml

  extension:
    name: Extension (build, test, package)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      # .npmrc disables dependency install scripts; the flag makes that explicit.
      - run: npm ci --ignore-scripts
      - name: Verify npm registry signatures
        run: npm audit signatures
      # Type-checks and builds via tsc.
      - run: npm run compile
      - run: npm test
      # Proves vsce can package with install scripts disabled and that
      # @types/vscode does not exceed engines.vscode.
      - name: Package .vsix
        run: npx vsce package --allow-missing-repository --out "$RUNNER_TEMP/rizo.vsix"
      - name: Check the package contains the chat view
        run: |
          missing=0
          for f in media/chat.html media/chat.css media/chat.js assets/mascot.png out/extension.js; do
            unzip -l "$RUNNER_TEMP/rizo.vsix" | grep -q "extension/$f\$" || { echo "::error::$f is missing from the .vsix"; missing=1; }
          done
          exit $missing
      # The built extension, for installing and clicking through a PR by hand:
      # download it from the run's Artifacts, then
      #   code --install-extension rizo.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rizo-vsix
          path: ${{ runner.temp }}/rizo.vsix
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: End-to-end (real VS Code)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    env:
      # A pinned VS Code release, checked against its SHA-256 before use.
      VSCODE_VERSION: 1.105.1
      VSCODE_SHA256: 32a650f1a111df00354ad9571f57d12268376777677dd5af2162ead921067a89
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run compile
      - name: Compile the end-to-end tests
        run: npx tsc -p tsconfig.e2e.json
      - name: Download VS Code ${{ env.VSCODE_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/vscode.tgz" "https://update.code.visualstudio.com/$VSCODE_VERSION/linux-x64/stable"
          echo "$VSCODE_SHA256  $RUNNER_TEMP/vscode.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/vscode.tgz" -C "$RUNNER_TEMP"
      - name: Install a virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      # Starts VS Code with Rizo loaded from this checkout and an empty
      # workspace folder; test/e2e/index.ts drives it against a fake
      # provider on 127.0.0.1. No real AI provider or key is used.
      - name: Run the end-to-end tests
        run: |
          mkdir -p "$RUNNER_TEMP/ws"
          xvfb-run -a "$RUNNER_TEMP/VSCode-linux-x64/code" \
            --no-sandbox --disable-gpu --disable-workspace-trust --disable-extensions \
            --skip-welcome --skip-release-notes --disable-telemetry \
            --user-data-dir "$RUNNER_TEMP/user-data" --extensions-dir "$RUNNER_TEMP/extensions" \
            --extensionDevelopmentPath="$PWD" \
            --extensionTestsPath="$PWD/out-e2e/index.js" \
            "$RUNNER_TEMP/ws"
        env:
          RIZO_E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e-results.json
          if-no-files-found: ignore
          retention-days: 14

  ci-passed:
    name: CI passed
    if: always()
    needs: [malware-scan, extension, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::A required CI job did not succeed ($r)."; exit 1; }
          done
