name: Release

# Tag-triggered on purpose: a Marketplace publish can't be fully undone,
# so it only runs when a release is cut explicitly:
#   git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that runs dependency code happens here, in a job with a
  # read-only token and no way to get publish credentials.
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify npm registry signatures
        run: npm audit signatures
      - run: npm run compile
      - run: npm test

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag is v$TAG_VERSION but package.json says $PKG_VERSION. Fix the tag or the version and push again."
            exit 1
          fi

      - name: Check this version isn't already on the Marketplace
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          ALREADY=$(npx vsce show ChaitanyaAggarwal.rizo --json | jq -r --arg v "$PKG_VERSION" '[.versions[].version] | index($v) != null')
          if [ "$ALREADY" = "true" ]; then
            echo "::error::v$PKG_VERSION is already on the Marketplace. Bump the version in vscode-extension/package.json, commit, and tag again."
            exit 1
          fi

      - name: Package .vsix
        id: package
        run: |
          VSIX="rizo-${GITHUB_REF_NAME#v}.vsix"
          npx vsce package --allow-missing-repository --out "$VSIX"
          sha256sum "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: vscode-extension/${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 7

  # Publishes the exact .vsix built above. Runs in the "marketplace"
  # environment, which only v* tags can deploy to and which holds the
  # Entra ID app's client and tenant IDs. No PAT exists anywhere: GitHub
  # issues a short-lived OIDC token that Entra ID exchanges for an
  # Azure DevOps token.
  publish:
    name: Publish to Marketplace
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: write # create the GitHub Release
      id-token: write # request the OIDC token for azure/login
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      # Checked out only so npm ci can install the pinned vsce from the lockfile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: vscode-extension

      - name: Sign in to Entra ID with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          sha256sum "$VSIX"
          npx vsce publish --packagePath "$VSIX" --azure-credential

      - name: Attach the .vsix to a GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: vscode-extension/${{ needs.build.outputs.vsix }}
          generate_release_notes: true
